[package]
name = "crbb"
version = "0.1.0"
edition = "2021"
description = "Reader-Restricted Byzantine Broadcast with Post-Execution Component-State Confidentiality"
license = "MIT"

[dependencies]
curve25519-dalek = { version = "4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
futures = "0.3"
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rcgen = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "crypto_batched"
harness = false

[[bin]]
name = "node"
path = "src/bin/node.rs"

[[bin]]
name = "controller"
path = "src/bin/controller.rs"