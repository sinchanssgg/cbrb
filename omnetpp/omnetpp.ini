[General]
network = Network
sim-time-limit = 60s
cmdenv-express-mode = false

*.node[*].numApps = 1
*.node[*].app[0].typename = "crbb.CRBBApp"

[Config Baseline]
*.node[*].app[0].n = 7
*.node[*].app[0].t = 2
*.node[*].app[0].c = 1
*.node[*].app[0].senderId = 0
*.node[*].app[0].messageLen = 32
*.node[*].app[0].byzantine = false

[Config ByzSender]
*.node[0].app[0].byzantine = true
*.node[0].app[0].byzDropRate = 0.5

[Config S1]
*.node[*].byzantineMode = 0
*.node[1].byzantineMode = 1
*.node[2].byzantineMode = 1

[Config S2]
*.node[*].byzantineMode = 0
*.node[1].byzantineMode = 2

[Config S3]
*.node[*].byzantineMode = 0
*.node[0].byzantineMode = 3
*.node[0].equivocateFirst = 4

[Config S4]
*.node[*].byzantineMode = 0
*.node[0].byzantineMode = 4
*.node[1].byzantineMode = 1
*.node[1].helperTarget = 3

[Config S6]
*.node[*].byzantineMode = 0
*.node[1].byzantineMode = 6
*.node[1].floodTarget = 3
*.node[1].floodCount = 3000